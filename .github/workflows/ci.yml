name: tests

on:
  push:
    branches: [main, master]
    paths: ["strait/**", "tests/**"]
  pull_request:
    paths: ["strait/**", "tests/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e "./strait[dev]"

      - name: Run tests
        run: |
          cd strait && python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: cd strait && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: strait/dist/

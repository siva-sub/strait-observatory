[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strait-observatory"
version = "0.3.0rc1"
description = "Satellite vessel detection & port activity monitoring from Sentinel-1 SAR"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sivasubramanian S."},
]
keywords = ["sentinel-1", "sar", "vessel", "detection", "port", "maritime", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "geopandas>=0.13",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
ais = ["websockets>=11.0"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/siva-sub/strait-observatory"
Documentation = "https://github.com/siva-sub/strait-observatory/tree/master/strait/docs"
Repository = "https://github.com/siva-sub/strait-observatory"
